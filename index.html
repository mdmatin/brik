<style id="skinBrick">
/* ==========================================================================
   BRIK — brick-wall look. Layered over Centric's mechanics: warm paper,
   dark-brown ink, terracotta accent, Bricolage Grotesque for display type.
   ========================================================================== */
:root{
  --font:'Brik', -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
  --font-disp:'Brik', -apple-system, "SF Pro Display", Inter, system-ui, sans-serif;
  --canvas:#fbf7f0; --parchment:#f3ede3; --sunken:#ece3d6; --hairline:#e6dccd; --card-edge:#e2d8c9;
  --ink:#2a1c14; --ink-2:#7d6b5e; --ink-3:#a8988a;
  --blue:#e2572b; --blue-focus:#e2572b; --or:#e2572b;
  --up:#4f7a3a; --up-bg:#e6efdf; --down:#c23b33;
  --dash:#cdbfac; --tabbar:#2a1c14; --tabon:#3d2c22; --tabink:#bfae9f;
  --r-card:24px;
}
html[data-theme=dark]{
  --canvas:#231913; --parchment:#17100c; --sunken:#2e231c; --hairline:#33271f; --card-edge:#33271f;
  --ink:#f3ede3; --ink-2:#b3a293; --ink-3:#7f6f62;
  --blue:#f06a3e; --or:#f06a3e; --up:#8fbf6a; --dash:#5a4a3e;
  --tabbar:#2e231c; --tabon:#4a382c; --tabink:#a8988a;
}
body{background:var(--parchment);font-family:var(--font)}
.card{background:var(--canvas);border-color:var(--card-edge);margin:0 14px 12px}

/* header: brik wordmark as the eyebrow, display-weight titles */
.nav{background:color-mix(in srgb,var(--parchment) 85%,transparent)}
.nav .eyebrow{text-transform:none;letter-spacing:-1px;font-size:22px;font-weight:800;color:var(--ink);line-height:1.1;margin-bottom:2px}
.nav h1{font-weight:800;font-size:34px;letter-spacing:-1.4px}
.nav.mini h1{font-size:17px;font-weight:800;letter-spacing:-.4px}
.di{position:relative;display:inline-block}
.di::after{content:"";position:absolute;left:50%;top:.05em;width:.27em;height:.27em;margin-left:-.135em;border-radius:50%;background:var(--or)}
.sechead{padding:18px 22px 8px}
.sechead h2{font-weight:800;font-size:20px;letter-spacing:-.6px}
.sechead button{color:var(--or);font-size:15px}
.row .n{font-weight:800;letter-spacing:-.3px}
.row .v{font-weight:800}
.empty{color:var(--ink-2)}

/* tab bar: solid dark pill, orange + beside it */
.tabs{background:var(--tabbar);backdrop-filter:none;-webkit-backdrop-filter:none;padding:6px;
  box-shadow:0 10px 26px rgba(42,28,20,.28);left:16px;right:88px;transform:none;justify-content:space-between}
.tabs::before,.tabs::after{display:none}
.tabs button{flex:1 1 0;min-width:0;color:var(--tabink);font-size:11.5px;font-weight:500;padding:7px 0}
.tabs button.on{color:#fff}
.tabs svg{width:21px;height:21px}
.tabblob{background:var(--tabon);height:calc(100% - 12px)}
.tabblob.moving{height:calc(100% - 4px);border-radius:24px;background:var(--tabon);box-shadow:none}
.tabblob::before,.tabblob::after{display:none}
.tabs.min{padding:6px}.tabs.min button{min-width:0}
.fab{right:16px;bottom:calc(10px + env(safe-area-inset-bottom));width:62px;height:62px;background:var(--or);
  box-shadow:0 8px 18px rgba(226,87,43,.38)}
.fab svg{width:27px;height:27px}

/* ---- brick pieces ---- */
.bw-hero{padding:4px 22px 0}
.bw-pct{font-weight:800;font-size:92px;letter-spacing:-5px;line-height:.86;color:var(--ink)}
.bw-pct small{font-size:40px;letter-spacing:-2px}
.bw-pct.over{color:var(--down)}
.bw-t{font-size:17px;letter-spacing:-.3px;margin-top:10px;color:var(--ink-2);line-height:1.3}
.bw-t b{color:var(--ink);font-weight:800}
.bw-wall{margin:16px 22px 0}
.bw-wall svg{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 22px 0;font-size:13px;color:var(--ink)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:14px;height:8px;border-radius:2px;display:inline-block;flex:none}
.leg i.dash{border:1.2px dashed var(--dash)}
.stats{display:flex;gap:10px;margin:14px 14px 12px}
.stats>div{flex:1;background:var(--canvas);border:1px solid var(--card-edge);border-radius:20px;padding:12px 14px;min-width:0}
.stats>div.tap{cursor:pointer}
.stats .k{font-size:12.5px;color:var(--ink-2)}
.stats .v{font-weight:800;font-size:21px;letter-spacing:-.6px;margin-top:2px;white-space:nowrap}
.stats .s{font-size:12px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--hairline);color:inherit;font:inherit}
.course:first-child{border-top:0}
.course .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.course .t b{font-weight:800;font-size:17px;letter-spacing:-.4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course .t span{font-size:13px;color:var(--ink-2);white-space:nowrap}
.course .t span em{font-style:normal;color:var(--ink);font-weight:800}
.course svg{display:block;width:100%;height:auto;margin-top:9px}
.course .cf{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-top:7px}
.course .cf .over{color:var(--down)}
.course.sm .t b{font-size:15.5px}
.hint2{margin:2px 26px 8px;font-size:12.5px;color:var(--ink-2)}
.bkc{display:flex;gap:2px;justify-content:flex-end;margin-top:5px;align-items:center}
.bkc i{width:9px;height:5px;border-radius:1.5px;display:inline-block;flex:none}
.bkc small{font-size:10px;color:var(--ink-2);margin-left:2px}
.btile{flex:0 0 42px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.btile svg{width:24px;height:18px}
.yard{display:flex;justify-content:space-around;align-items:flex-end;margin:6px 14px 0;padding:18px 8px 14px;background:var(--canvas);border:1px solid var(--card-edge);border-radius:24px;gap:8px}
.yard>div{text-align:center;min-width:0}
.yard svg{display:block;margin:0 auto;max-width:100%;height:auto}
.yard b{display:block;font-weight:800;font-size:17px;margin-top:8px}
.yard span{font-size:13px;color:var(--ink-2)}
.settle{display:flex;align-items:center;gap:12px;padding:14px 16px}
.settle .l{flex:1;min-width:0}.settle .n{font-weight:800;font-size:17px;letter-spacing:-.3px}
.settle .m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.settle .v{font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.catpill{display:inline-block;font-size:13px;color:#fff;border-radius:20px;padding:5px 12px;font-weight:500}
.cathero{padding:4px 22px 0}
.cathero .big{font-weight:800;font-size:40px;letter-spacing:-1.6px;line-height:1.05}
.cathero .big small{font-size:20px;color:var(--ink-2);letter-spacing:-.4px;font-weight:500}
.cathero .s{color:var(--ink-2);font-size:15px;margin-top:4px}.cathero .s b{color:var(--ink);font-weight:800}

/* chips / segments / search in the warm palette */
.chip{background:var(--canvas);border:1px solid var(--card-edge);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--parchment);border-color:var(--ink)}
.seg{background:var(--sunken)}.seg button.on{background:var(--canvas);color:var(--ink)}
.search{background:var(--canvas);border:1px solid var(--card-edge)}
.daygroup{color:var(--ink-2)}

/* entry sheet: brick preview under the amount */
.xbricks{margin:6px 2px 2px;text-align:center;font-size:13.5px;color:var(--ink-2)}
.xbricks b{color:var(--or);font-weight:800}
.xbricks svg{display:block;width:100%;height:auto;margin-top:8px}
#xsheet .btn:not(.danger){background:var(--or)}
.xa-amt b{font-weight:800}
.page{background:var(--parchment)}
/* dark: keep the warm browns instead of Centric's black chrome */
html[data-theme=dark] .nav{background:color-mix(in srgb,var(--parchment) 86%,transparent)}
html[data-theme=dark] .pg-head{background:color-mix(in srgb,var(--parchment) 88%,transparent)}
html[data-theme=dark] .tabs{background:var(--tabbar);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 1px #3d2e25}
html[data-theme=dark] .tabs button{color:var(--tabink)}
html[data-theme=dark] .tabs button.on{color:#fff}
.pg-head{background:color-mix(in srgb,var(--parchment) 88%,transparent)}

.course .t span em.down{color:var(--down)}
.stand .course + .rowtotal{border-top:1px solid var(--hairline)}
/* selected picker tile: warm tint, not Centric's blue */
.xgrid.pills > button.on,.xgrid.tiles > button.on,.xpb > .xgrid.tiles > button.on{background:color-mix(in srgb,var(--or) 9%,var(--canvas));box-shadow:inset 0 0 0 2px var(--or);color:var(--or)}
</style>
<script>try{if(localStorage.getItem("cbt.skin")==="og")document.getElementById("skinBrick").disabled=true}catch(e){}</script>
</head>

<!-- =================== SETUP =================== -->
<section id="setup" class="setup" hidden>
  <h1>Open your tracker</h1>
  <p id="setupMsg">Enter the passcode you set in the sheet's script. It is stored only on this device.</p>
  <div id="setupErr" class="err" hidden></div>
  <div class="fields">
    <div class="f" id="urlField" hidden><label>URL</label><input id="inUrl" placeholder="https://script.google.com/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"></div>
    <div class="f"><label>Passcode</label><input id="inKey" type="password" placeholder="from the sheet" autocapitalize="off" inputmode="numeric"></div>
  </div>
  <button class="btn" id="btnConnect">Open</button>
  <p class="hint"><span id="buildStamp2" class="faint"></span></p>
</section>

<!-- =================== APP =================== -->
<div id="app" hidden>
  <header class="nav">
    <div class="navl">
      <div class="eyebrow" id="navDate"></div>
      <h1 id="title">Overview</h1>
      <div class="sub" id="navSub"><span class="dot" id="dot"></span><span id="statusTxt">Loading…</span></div>

const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };

/* ---------- formatting ---------- */
const inr  = new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const inrP = new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fINR  = v => v==null ? '—' : (v<0?'−':'') + '₹' + inr.format(Math.abs(Math.round(v)));
const fINR2 = v => v==null ? '—' : (v<0?'−':'') + '₹' + inrP.format(Math.abs(v));
const fCompact = v => { if(v==null) return '—'; const a=Math.abs(v), s=v<0?'−':'';
  if(a>=1e7) return s+'₹'+(a/1e7).toFixed(2)+'Cr'; if(a>=1e5) return s+'₹'+(a/1e5).toFixed(1)+'L';
  if(a>=1e3) return s+'₹'+(a/1e3).toFixed(1)+'k'; return s+'₹'+inr.format(a); };
const pct = (a,b) => b>0 ? a/b : 0;
const todayISO = () => { const d=new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dmy = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };
const fDay = s => { if(!s) return ''; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s;
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}); };
const ago = ms => { const m=Math.round(ms/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago';
  const h=Math.round(m/60); if(h<24) return h+' h ago'; return Math.round(h/24)+' d ago'; };
function bigAmt(t){ const m = String(t).match(/^([\u2212+-]?)([\u20b9$])([\d,]+)(\.\d+)?(.*)$/);
  return m ? `${m[1]}<span class="bcs">${m[2]}</span>${m[3]}${m[4] ? `<span class="bdc">${m[4]}</span>` : ''}${esc(m[5])}` : esc(t); }
const plural = (n,w) => n+' '+w+(n===1?'':'s');
const dayHd = s => { const d = new Date(s+'T00:00:00'); return isNaN(d) ? dmy(s) : d.toLocaleDateString('en-US',{weekday:'short'}) + ' ' + dmy(s); };   // Sun 08/11/2026

   ========================================================================== */
function accountList(){ const a = D && D.config && D.config.accounts;
  return Array.isArray(a) ? a : String(a||'').split(',').map(s=>s.trim()).filter(Boolean); }
const subsOf = cat => (D ? D.budget.filter(b=>b.category===cat).map(b=>b.subcategory).filter(Boolean) : []);
const catsList = () => { const out=[]; (D?D.budget:[]).forEach(b=>{ if(b.category && !out.includes(b.category)) out.push(b.category); }); return out; };

function calc(){
  const c = D.config, A = c.person_a, B = c.person_b;
  const lines = D.budget.map(b=>({ ...b, spent:0 }));
  const key = (a,b) => a + '\u0000' + (b||'');
  const byLine = {}; lines.forEach(l=>byLine[key(l.category,l.subcategory)] = l);
  const loose = {};                                  // spent against a category with no matching subcategory line
  D.expenses.forEach(e=>{ const l = byLine[key(e.category,e.subcategory)];
    if (l) l.spent += e.amount; else loose[e.category] = (loose[e.category]||0) + e.amount; });
  const cats = [];
  lines.forEach(l=>{ let k = cats.find(x=>x.name===l.category);
    if (!k){ k = { name:l.category, budget:0, spent:0, subs:[] }; cats.push(k); }
    k.budget += l.budgeted; k.spent += l.spent; k.subs.push(l); });
  Object.keys(loose).forEach(n=>{ let k = cats.find(x=>x.name===n);
    if (!k){ k = { name:n, budget:0, spent:0, subs:[] }; cats.push(k); }
    k.spent += loose[n]; k.unassigned = loose[n]; });
  const budget = cats.reduce((s,k)=>s+k.budget,0), spent = D.expenses.reduce((s,e)=>s+e.amount,0);
  const paid = {[A]:0,[B]:0}; D.expenses.forEach(e=>{ if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=e.amount; });
  const funds = {[A]:0,[B]:0}; D.funds.forEach(f=>{ if(funds[f.person]!==undefined) funds[f.person]+=f.amount; });
  let recvA=0, giveA=0; D.settlements.forEach(s=>{ if(s.to===A) recvA+=s.amount; if(s.from===A) giveA+=s.amount; });
  const shareA = budget*c.split_a, shareB = budget*c.split_b, balA = paid[A] - spent*c.split_a - recvA + giveA;
  return { A, B, cats, budget, spent, remaining: budget-spent,
    fundsTotal: funds[A]+funds[B], toRaise: budget-(funds[A]+funds[B]), cash: funds[A]+funds[B]-spent,
    people: [
      { name:A, funds:funds[A], paid:paid[A], share:shareA, gap:shareA-funds[A], cash:funds[A]-paid[A]+recvA-giveA, balance:balA },
      { name:B, funds:funds[B], paid:paid[B], share:shareB, gap:shareB-funds[B], cash:funds[B]-paid[B]-recvA+giveA, balance:-balA } ] };
}

/* ==========================================================================
   BRICKS — one brick is a fixed rupee amount, picked so the whole budget
   makes a wall of roughly 100–160 bricks.
   ========================================================================== */
let BRICK = 20000;
const NICE = [1000,2000,2500,5000,10000,20000,25000,50000,100000,200000,250000,500000,1000000,2000000,2500000,5000000];
function pickBrick(budget){ return NICE.find(v=>budget/v <= 160) || NICE[NICE.length-1]; }
const bricks = v => v / BRICK;
const bN = v => { const n = bricks(v); return n >= 10 || Math.abs(n-Math.round(n)) < .05 ? String(Math.round(n)) : n.toFixed(1); };
const brickLabel = () => fCompact(BRICK).replace('.0k','k').replace('.0L','L');
const DASH = 'var(--dash)';

/* A staggered wall. `fill` is a list of colours for laid bricks, bottom-left first;
   the rest are drawn dashed. Returns an SVG that scales to its container. */
function wallSvg(nTotal, fill, cols){
  cols = Math.max(2, cols); const rows = Math.max(2, Math.round(nTotal/cols) || 1);
  const W = 342, bw = W/cols, bh = bw*0.44, H = rows*bh, g = 3;
  const cells = [];
  for (let r=0;r<rows;r++){ const y = H-(r+1)*bh, off = r%2 ? bw/2 : 0;
    for (let k=-1;k<cols;k++){ let x = k*bw+off, w = bw; if (x<0){ w += x; x = 0; } if (x+w > W) w = W-x; if (w <= 4) continue; cells.push([x,y,w]); } }
  const laid = Math.min(cells.length, Math.round(fill.length * cells.length / Math.max(1,nTotal)));
  const col = i => fill[Math.min(fill.length-1, Math.floor(i * fill.length / Math.max(1,laid)))];
  let s = `<svg viewBox="0 0 ${W} ${H.toFixed(1)}" role="img">`;
  cells.forEach(([x,y,w],i)=>{
    s += i < laid
      ? `<rect x="${(x+g/2).toFixed(1)}" y="${(y+g/2).toFixed(1)}" width="${(w-g).toFixed(1)}" height="${(bh-g).toFixed(1)}" rx="3" fill="${col(i)}"/><rect x="${(x+g/2).toFixed(1)}" y="${(y+g/2).toFixed(1)}" width="${(w-g).toFixed(1)}" height="3" rx="1.5" fill="#fff" opacity=".18"/>`
      : `<rect x="${(x+g/2).toFixed(1)}" y="${(y+g/2).toFixed(1)}" width="${(w-g).toFixed(1)}" height="${(bh-g).toFixed(1)}" rx="3" fill="none" stroke="${DASH}" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  });
  return s + '</svg>';
}
/* One course: a single row of bricks. Long courses are shortened to `max`
   bricks, keeping the laid share. `ex` = new bricks being added (entry sheet). */
function courseSvg(total, laid, col, h=18, max=24, ex=0){
  let n = Math.max(1, Math.round(total)), k = 1;
  if (n > max){ k = max/n; n = max; }
  laid *= k; ex *= k;
  const W = 330, gap = n > 18 ? 2 : 3, bw = (W-gap*(n-1))/n;
  let s = `<svg viewBox="0 0 ${W} ${h}">`;
  for (let i=0;i<n;i++){ const x = i*(bw+gap), f = Math.max(0,Math.min(1,laid-i)), e = Math.max(0,Math.min(1,laid+ex-i)) - f;
    s += `<rect x="${x.toFixed(1)}" y=".6" width="${bw.toFixed(1)}" height="${h-1.2}" rx="2.5" fill="none" stroke="${DASH}" stroke-dasharray="2.5 2.5"/>`;
    if (f>0) s += `<rect x="${x.toFixed(1)}" y="0" width="${(bw*f).toFixed(1)}" height="${h}" rx="2.5" fill="${col}"/><rect x="${x.toFixed(1)}" y="0" width="${(bw*f).toFixed(1)}" height="3" rx="1.5" fill="#fff" opacity=".2"/>`;
    if (e>0) s += `<rect x="${(x+bw*f).toFixed(1)}" y=".75" width="${(bw*e).toFixed(1)}" height="${h-1.5}" rx="2.5" fill="${tint(col,.55)}" stroke="var(--or)" stroke-width="1.5"/>`; }
  return s + '</svg>';
}
const pctTxt = (a,b) => b>0 ? Math.round(a/b*100) : 0;

/* ---------- Still to bring: each funder's share of the budget vs what they've put in ---------- */
/* ---------- Where we stand: per person, two tabs — what's still to bring, and cash in hand ----------
   Both panes sit in the same grid cell, so switching tabs never changes the height. */
let standTab = 'bring';
const STAND_TABS = [['bring','Still to bring'],['hand','Cash in hand']];
function standWrap(head, panes){
  return `<div class="sechead"><h2>Where we stand</h2>${STAND_TABS.map(([k])=>`<span class="faint stand-meta" data-standmeta="${k}" ${standTab===k?'':'hidden'} style="font-size:13px">${head[k]}</span>`).join('')}</div>
    <div class="card stand"><div class="seg">${STAND_TABS.map(([k,l])=>`<button data-stand="${k}" class="${standTab===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="panes">${STAND_TABS.map(([k])=>`<div data-pane="${k}" class="${standTab===k?'':'off'}">${panes[k]}</div>`).join('')}</div></div>`;

function toBringHtml(m, compact){
  const shade = ['#c4512c','#d8784f'];
  const need = m.people.reduce((s,p)=>s+Math.max(0,p.gap),0), tot = m.people.reduce((s,p)=>s+inHand(p),0);
  // both tabs draw the same way: name and figure, a course of bricks, then the working underneath
  const course = (p, i, right, total, laid, left, rightSm) => `<div class="course ${compact?'sm':''}"><div class="t"><b>${esc(p.name)}</b><span>${right}</span></div>
      ${courseSvg(bricks(total), bricks(laid), shade[i], compact?13:18)}
      <div class="cf"><span>${left}</span><span>${rightSm}</span></div></div>`;
  const totRow = (l, v, down) => `<div class="rowtotal num money"><span>${l}</span><span class="${down?'down':''}">${v}</span></div>`;
  const bring = m.people.map((p,i)=>{ const left = Math.max(0,p.gap);
      return course(p, i, left < 1 ? '<em>Fully funded</em>' : `<em>${fINR(left)}</em> · ${bN(left)} bricks`, p.share, p.funds, `${fCompact(p.funds)} in of ${fCompact(p.share)} share`, pctTxt(p.funds,p.share)+'%'); }).join('')
    + totRow('Total', need<1 ? 'All funded' : fINR(need));
  const hand = m.people.map((p,i)=>{ const h = inHand(p);
      return course(p, i, `<em class="${h<0?'down':''}">${fINR(h)}</em> · ${bN(Math.max(0,h))} bricks`, p.funds, Math.max(0,h), `${fCompact(p.funds)} in − ${fCompact(p.paid)} paid out`, pctTxt(Math.max(0,h),p.funds)+'% left'); }).join('')
    + totRow('Total', fINR(tot), tot<0);
  return standWrap({ bring: need<1 ? 'all funded' : fCompact(need)+' · '+bN(need)+' bricks', hand: fCompact(tot)+' · '+bN(Math.max(0,tot))+' bricks' }, { bring, hand });
}

/* ---------- Expenses (Centric's Activity list) ---------- */
const BADGE = `<span class="tarw ex" aria-label="Expense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>`;

function brickChips(v, c){
  const n = bricks(v), full = Math.floor(n), part = n - full; let s = '';
  for (let i=0;i<Math.min(full,8);i++) s += `<i style="background:${c}"></i>`;
  if (full > 8) s += `<small>+${full-8}</small>`; else if (part > .05) s += `<i style="background:${c};width:${(9*part).toFixed(1)}px"></i>`;
  return s;
}

  const meta = [e.category!==title?e.category:null, e.subcategory && e.subcategory!==title ? e.subcategory : null, e.paidBy, e.account].filter(Boolean).join(' · ');

/* ---------- Yard (funds): money put in, as bricks delivered ---------- */
function palletSvg(n, col){
  n = Math.max(0, Math.round(n)); const per = n > 120 ? Math.ceil(n/120) : 1, shown = Math.ceil(n/per);
  const cols = shown > 48 ? 8 : 6, rows = Math.max(1, Math.ceil(shown/cols)), bw = 20, bh = 10, g = 2, W = cols*(bw+g)-g, H = rows*(bh+g)+6;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`, i = 0;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){ if (i++ >= shown) break;
    s += `<rect x="${c*(bw+g)}" y="${(rows-1-r)*(bh+g)}" width="${bw}" height="${bh}" rx="2" fill="${col}"/>`; }
  return s + `<rect x="0" y="${rows*(bh+g)}" width="${W}" height="6" rx="1" fill="#a88f74"/></svg>`;
}

  const fRow = f => `<button class="row trow" data-fund="${f.id}">${personMark(f.person)}<div class="l"><div class="n">${esc(f.person)}</div><div class="m">${esc([f.note || 'Funds in', f.linked ? 'from Money' : ''].filter(Boolean).join(' · '))}</div></div><div class="r"><div class="v num money ${f.amount<0?'down':'up'}">${f.amount<0?'−':'+'}${fINR(Math.abs(f.amount))}</div><div class="s">${bN(Math.abs(f.amount))} bricks</div></div></button>`;

/* ---------- Budget (Centric's budget card) ---------- */
function vbRow(lbl, s, b, total, attr=''){
  const u = b ? s/b : (s?1.01:0), over = s > b;
  return `<div class="vb-row ${total?'total':'tap slim'}" ${attr}>
    <div class="vb-l"><span>${esc(lbl)}</span><b class="num money">${fINR(b)}</b></div>
    <div>${total?'':`<div class="vb-pc num">${Math.round(u*100)}%</div>`}<div class="vb-tr ${over?'over':''} ${u>=0.97?'full':''}"><i style="width:${Math.min(100,u*100).toFixed(1)}%"></i>${total?`<span>${Math.round(u*100)}%</span>`:''}</div>
    <div class="vb-n"><span class="num money ${over?'down':'sp'}">${fINR(s)}</span><span class="num money ${total?'':over?'down':''}">${fINR(b-s)}</span></div></div></div>`;
}
/* Centric's budget page pieces: a tinted bar in the category's colour, and a row per line —
   icon, name and % used, the bar, then spent of budget · left (or over) */
const OG_PC = { us:0, rt:1, lq:2, in:3, mf:4, pk:5, cr:6, gd:7, bk:8, ep:9, bu:15, ch:11, mg:12, lm:13, br:14 };
const ogCatCol = cat => { const m = XMAP.find(([re])=>re.test(cat||'')) || [0,'more','ch']; return `var(--pc${OG_PC[m[2]] ?? 11})`; };
const tbar = (u, col, cls) => `<div class="tbar ${cls||''}" style="--c:${col}"><i style="width:${Math.min(100,Math.max(0,u)*100).toFixed(1)}%"></i></div>`;
function vbxRow(tile, name, s, b, col, attr){
  const u = b ? s/b : (s ? 1.01 : 0), over = s > b;
  return `<div class="row tap vbx" ${attr||''}>${tile}<div class="l">
    <div class="vbx-h"><div class="n">${esc(name)}</div><div class="vbx-p num ${over?'down':''}">${b ? Math.round(u*100)+'%' : 'No budget'}</div></div>
    ${tbar(u, over ? 'var(--over)' : col)}
    <div class="vbx-m"><span class="num money">${fINR(s)} of ${fCompact(b)}</span><span class="num money ${over?'down':''}">${fINR(Math.abs(b-s))} ${over?'over':'left'}</span></div></div></div>`;
}
function vbSummary(label, spent, budget, extraRight){

      ${tbar(u, left<0 ? 'var(--over)' : 'var(--blue)', 'big')}
      <div class="spstats lcr"><div><span>Budget</span><b class="num money">${fINR(budget)}</b></div><div><span>Spent</span><b class="num money">${fINR(spent)}</b></div><div><span>Used</span><b class="num">${Math.round(u*100)}%</b></div></div></div>`;
}

/* Who paid what in one category: a split bar, then one row per person
   (share of this category, amount, number of payments). */
function whoPaidHtml(ex, extra){
  const total = ex.reduce((s,e)=>s+e.amount,0);
  if (!total) return '';
  const names = [D.config.person_a, D.config.person_b];
  ex.forEach(e=>{ if (e.paidBy && !names.includes(e.paidBy)) names.push(e.paidBy); });
  const by = names.map(n=>{ const l = ex.filter(e=>e.paidBy===n); return { n, amt:l.reduce((s,e)=>s+e.amount,0), cnt:l.length }; }).filter(x=>x.cnt);
  const tint = i => ['var(--blue)','#ff9f0a','#8e8e93'][i] || '#8e8e93';

/* ==========================================================================
   NAV — Centric's floating glass bar with the travelling lens
   ========================================================================== */
const tabBlob = document.createElement('span');
tabBlob.className = 'tabblob';
$('.tabs').prepend(tabBlob);
let blobFlight = null;
function slotOf(btn){ const b = btn.getBoundingClientRect(), bar = $('.tabs').getBoundingClientRect(); return { x: b.left - bar.left, w: b.width }; }
function moveBlob(animate){
  const on = $('.tabs button.on'); if(!on) return;
  const s = slotOf(on), prev = parseFloat(tabBlob.style.getPropertyValue('--bx')) || 0;
  if (animate && Math.abs(prev - s.x) > 1){ tabBlob.classList.add('moving'); clearTimeout(blobFlight); blobFlight = setTimeout(()=>tabBlob.classList.remove('moving'), 560); }
  tabBlob.style.setProperty('--bx', s.x + 'px'); tabBlob.style.width = s.w + 'px';
}
let blobFollow = 0;
function followBlob(ms){
  const until = performance.now() + ms; tabBlob.classList.add('track'); cancelAnimationFrame(blobFollow);
  const step = ()=>{ moveBlob(false); if (performance.now() < until) blobFollow = requestAnimationFrame(step); else tabBlob.classList.remove('track'); };
  step();
}
addEventListener('resize', ()=>followBlob(60));
$$('.tabs button').forEach(b=>{ const t=[...b.childNodes].find(n=>n.nodeType===3 && n.textContent.trim()); if(!t) return;
  const sp=document.createElement('span'); sp.className='tl'; sp.textContent=t.textContent.trim(); t.replaceWith(sp); });
const navBar = $('.tabs'); navBar.style.touchAction = 'none';
let navDrag = null;
function tabNearestX(x){ let best=null, bestD=Infinity;
  $$('.tabs button').forEach(b=>{ const r=b.getBoundingClientRect(), d=Math.abs(x-(r.left+r.width/2)); if(d<bestD){ bestD=d; best=b; } }); return best; }
navBar.addEventListener('pointerdown', e=>{ if(!e.target.closest('button')) return; navDrag = { x0:e.clientX, id:e.pointerId, moved:false, target:null }; navBar.classList.add('pressing'); });
const navSpring = { x:0, v:0, target:0, raf:null };
function navTick(){
  navSpring.v += (navSpring.target - navSpring.x) * 0.26; navSpring.v *= 0.74; navSpring.x += navSpring.v;
  const stretch = Math.min(Math.abs(navSpring.v) * 0.011, 0.20);
  tabBlob.style.setProperty('--bx', navSpring.x.toFixed(2) + 'px');
  tabBlob.style.setProperty('--sx', (1 + stretch).toFixed(3)); tabBlob.style.setProperty('--sy', (1 - stretch * 0.55).toFixed(3));
  navSpring.raf = requestAnimationFrame(navTick);
}
navBar.addEventListener('pointermove', e=>{
  if(!navDrag || e.pointerId !== navDrag.id) return;
  if(!navDrag.moved){
    if(Math.abs(e.clientX - navDrag.x0) < 8) return;
    navDrag.moved = true; try{ navBar.setPointerCapture(navDrag.id); }catch(_){}
    navBar.classList.remove('pressing'); navBar.classList.add('dragging'); tabBlob.classList.add('moving'); clearTimeout(blobFlight);
    navSpring.x = parseFloat(tabBlob.style.getPropertyValue('--bx')) || 0; navSpring.v = 0; cancelAnimationFrame(navSpring.raf); navTick();
  }
  const t = tabNearestX(e.clientX); navDrag.target = t;
  $$('.tabs button').forEach(b=>b.classList.toggle('on', b===t));
  const br = navBar.getBoundingClientRect(), s = slotOf(t); tabBlob.style.width = s.w + 'px';
  navSpring.target = Math.max(2, Math.min(br.width - s.w - 2, e.clientX - br.left - s.w/2));
});
function endNavDrag(e){
  if(!navDrag) return; const wasDrag = navDrag.moved, target = navDrag.target; navDrag = null; navBar.classList.remove('pressing');
  if(!wasDrag) return;
  cancelAnimationFrame(navSpring.raf); navSpring.raf = null; tabBlob.style.setProperty('--sx', 1); tabBlob.style.setProperty('--sy', 1);
  navBar.classList.remove('dragging');
  const v = (target || tabNearestX(e.clientX)).dataset.v; if(v !== activeView) show(v); else moveBlob();
  clearTimeout(blobFlight); blobFlight = setTimeout(()=>tabBlob.classList.remove('moving'), 420);
}
['pointerup','pointercancel'].forEach(ev => navBar.addEventListener(ev, endNavDrag));
let navLastY = 0;
addEventListener('scroll', ()=>{
  const y = Math.max(0, window.scrollY); if (Math.abs(y - navLastY) < 12) return;
  const down = y > navLastY; navLastY = y; const bar = $('.tabs'), want = down && y > 90;
  if (want === bar.classList.contains('min')) return; bar.classList.toggle('min', want); followBlob(360);

const PTR_ARM = 64, PTR_MAX = 96;
let ptrY0 = null, ptrPull = 0, ptrBusy = false;
function ptrAtTop(){ return document.body.classList.contains('paged') ? $('#page').scrollTop <= 0 : window.scrollY <= 0; }
function ptrBlocked(e){ return !!(document.querySelector('#xsheet.show') || (e.target.closest && e.target.closest('input,textarea,select'))); }
function ptrPaint(px, armed){ const el = $('#ptr'); el.style.transition = 'none'; el.style.opacity = Math.min(1, px / PTR_ARM);
  el.style.transform = `translate(-50%, ${px - 56}px) rotate(${px * 3.2}deg)`; el.classList.toggle('armed', !!armed); }
function ptrSpin(on){ const el = $('#ptr'); ptrBusy = on; el.style.transition = 'transform .25s ease, opacity .25s ease';
  if (on){ el.classList.add('spin'); el.style.opacity = 1; el.style.transform = 'translate(-50%, 8px)'; }
  else { el.classList.remove('spin','armed'); el.style.opacity = 0; el.style.transform = 'translate(-50%, -56px)'; } }
window.addEventListener('touchstart', e=>{ if (ptrBusy || loading || e.touches.length !== 1 || !ptrAtTop() || ptrBlocked(e) || $('#app').hidden){ ptrY0 = null; return; }
  ptrY0 = e.touches[0].clientY; ptrPull = 0; }, { passive:true });
window.addEventListener('touchmove', e=>{ if (ptrY0 == null) return; const dy = e.touches[0].clientY - ptrY0;
  if (dy <= 0 || !ptrAtTop()){ if (ptrPull) ptrPaint(0,false); ptrPull = 0; return; }
  ptrPull = Math.min(PTR_MAX, dy * 0.5); ptrPaint(ptrPull, ptrPull >= PTR_ARM); }, { passive:true });
window.addEventListener('touchend', ()=>{ if (ptrY0 == null) return; const go = ptrPull >= PTR_ARM; ptrY0 = null; ptrPull = 0;
  if (go){ haptic(8); refresh(true); } else ptrSpin(false); }, { passive:true });

// as in Centric: % after + or − is a share of what came before (1200 − 15% = 1020); after × or ÷, or alone, it's /100
const xEval = s => { const t = String(s||'').replace(/[+−×÷.]+$/,''); if (!t) return 0;
  const toks = t.match(/\d*\.?\d+%?|[+−×÷]/g) || []; let sum=0, sign=1, term=null, mul=null, first=true;
  toks.forEach(k=>{ if (k==='+'||k==='−'){ sum += sign*(term||0); sign = k==='−'?-1:1; term=null; mul=null; first=false; }
    else if (k==='×'||k==='÷') mul = k;
    else { let v = parseFloat(k); if (k.endsWith('%')) v = (term==null && !first) ? sum*v/100 : v/100;
      term = term==null ? v : mul==='÷' ? (v?term/v:term) : term*v; mul=null; } });
  sum += sign*(term||0); return Math.round(sum*100)/100; };
const xHasOp = s => /[+−×÷]/.test(String(s).slice(1));
const xAmt = () => xEval(X.expr);
function xKey(k){
  let s = X.expr;
  if (X.fresh){ X.fresh = false; if (/^\d+$/.test(k) || k==='.') s = ''; }
  if (/^\d+$/.test(k)){ const cur = s.split(/[+−×÷]/).pop(); if (/\.\d\d$/.test(cur) || cur.endsWith('%')) return; if (cur==='0' && k!=='.') s = s.slice(0,-1); s += k; }
  else if (k==='.'){ const cur = s.split(/[+−×÷]/).pop(); if (!cur.includes('.') && !cur.endsWith('%')) s += cur==='' ? '0.' : '.'; }
  else if (k==='%'){ const cur = s.split(/[+−×÷]/).pop(); if (/\d$/.test(cur)) s += '%'; }   // a percent closes the number it follows
  else if (X_OPS.includes(k)){ if (!s) return; s = X_OPS.includes(s.slice(-1)) ? s.slice(0,-1)+k : s+k; }
  else if (k==='=') { if (s) s = String(xEval(s)); }
  else if (k==='⌫') s = s.slice(0,-1);
  else if (k==='C') s = '';
  X.expr = s;
}

function grab(){ const n = $('#xNote'), nm = $('#xName'), sn = $('#xSubName'), d = $('#xDate'); if (n) X.note = n.value; if (nm) X.name = nm.value; if (sn) X.subName = sn.value; if (d) X.date = d.value || X.date; }
// whose money an account is: the second funder's accounts carry their name (Halim · C); every other account is person A's

  const B = D.config.person_b || ''; return B && new RegExp('^\\s*' + B.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'i').test(a || '') ? B : D.config.person_a; };

    i.addEventListener('input', ()=>{ const x = i.closest('.xa-in').querySelector('.xa-x'); if (x) x.classList.toggle('show', !!i.value); }); });

async function saveX(){
  grab();
  const amt = xAmt(), m = X.mode;
  const fail = msg => { X.err = msg; paintX(); $('#xsheet .xscroll').scrollTop = 0; };
  if (m==='cat'){ const nm = X.name.trim(); if (!nm) return fail('Give the category a name');
    if (calc().cats.some(k=>k.name.toLowerCase()===nm.toLowerCase())) return fail('That category already exists');
    return post('addSubcategory', { category:nm, subcategory:X.subName.trim(), budgeted:amt }, 'Category added'); }
  if (m==='sub'){ if (!X.name.trim()) return fail('Give the subcategory a name');
    if (subsOf(X.rec.category).includes(X.name.trim())) return fail('That subcategory already exists');
    return post('addSubcategory', { category:X.rec.category, subcategory:X.name.trim(), budgeted:amt }, 'Subcategory added'); }
  if (m==='budget') return post('setBudget', { category:X.rec.category, subcategory:X.rec.subcategory, budgeted:amt }, 'Budget updated');
  if (!(amt > 0)) return fail('Enter an amount');
  if (m==='expense'){
    if (!X.cat) return fail('Pick a category');
    if (X.acct && X.who !== accOwner(X.acct)) return fail(`${X.acct} is ${accOwner(X.acct)}'s account — Paid by must be ${accOwner(X.acct)}`);
    const p = { date:X.date, account:X.acct, category:X.cat, subcategory:X.sub, note:X.note.trim(), amount:amt, paidBy:X.who };
    if (X.rec){ p.id = X.rec.id; p.was = { date:X.rec.date, amount:X.rec.amount }; return post('updateExpense', p, 'Expense updated'); }
    if (X.acct) lsSet(LS.acct, X.acct);
    return post('addExpense', p, 'Expense saved');
  }
  const was = X.rec ? { id:X.rec.id, was:{ date:X.rec.date, amount:X.rec.amount } } : null;
  if (m==='fund'){ const p = { date:X.date, person:X.person, amount:amt, note:X.note.trim() };
    return was ? post('updateFund', Object.assign(p, was), 'Funds entry updated') : post('addFund', p, 'Funds logged'); }
  if (m==='settle'){ if (X.from===X.to) return fail('From and To must be different');
    if (!!X.facc !== !!X.tacc) return fail('Pick both accounts, or neither if no money moved between accounts');
    if (X.facc && accOwner(X.facc)!==X.from) return fail(`${X.facc} is ${accOwner(X.facc)}'s account — it can't be ${X.from}'s`);
    if (X.tacc && accOwner(X.tacc)!==X.to) return fail(`${X.tacc} is ${accOwner(X.tacc)}'s account — it can't be ${X.to}'s`);
    const p = { date:X.date, from:X.from, to:X.to, amount:amt, mode: X.rec && !/→/.test(X.rec.mode||'') ? X.rec.mode : '', note:X.note.trim(), fromAccount:X.facc, toAccount:X.tacc };
    return was ? post('updateSettlement', Object.assign(p, was), 'Settlement updated') : post('addSettlement', p, 'Settlement recorded'); }
}
async function post(action, payload, okMsg, force){
  const btn = $('#xsheet [data-save]'); if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const reset = ()=>{ if (btn){ btn.disabled = false; btn.textContent = 'Save'; } };
  try{
    const j = await apiPost(action, payload, force);
    if (!j.ok && j.error==='duplicate'){ if (confirm('An identical entry already exists. Add it anyway?')) return post(action, payload, okMsg, true); reset(); return; }
    if (!j.ok && j.error==='stale'){ closeX(); toast('That entry changed in the sheet. Refreshed — try again.'); refresh(false); return; }
    if (!j.ok && j.error==='bad_passcode'){ closeX(); [LS.pass].forEach(lsDel); showSetup('Your saved passcode no longer works.'); return; }
    if (!j.ok) throw new Error(j.error==='unknown_action' ? 'The sheet script needs updating to allow this' : j.error);
    setData(j.data); render(); closeX(); toast(okMsg); setStatus('Updated just now','');
  }catch(e){ X.err = e.message && e.message!=='Failed to fetch' ? e.message : 'Could not save — check your connection'; reset(); paintX(); }
}

  let y0 = null, x0 = 0, dy = 0, t0 = 0, vert = null;
  const el = () => $('#xsheet');
  document.addEventListener('touchstart', e=>{ const s = el(); if (s.hidden || !s.classList.contains('show') || e.touches.length !== 1 || !s.contains(e.target)) return;
    const onHandle = e.target.closest('.xhd'), inner = e.target.closest('.xscroll, .xpb');
    if (!onHandle && ((inner && inner.scrollTop > 0) || e.target.closest('input,textarea,select,.xkp'))) return;
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); vert = null; }, { passive:true });
  document.addEventListener('touchmove', e=>{ if (y0 == null) return; const s = el(), my = e.touches[0].clientY - y0, mx = e.touches[0].clientX - x0;
    if (vert == null && (Math.abs(my) > 6 || Math.abs(mx) > 6)) vert = Math.abs(my) > Math.abs(mx) && my > 0;
    if (!vert){ if (vert === false) y0 = null; return; }
    dy = Math.max(0, my); if (e.cancelable) e.preventDefault(); s.style.transition = 'none'; s.style.transform = `translateY(${dy}px)`; }, { passive:false });
  const end = ()=>{ if (y0 == null) return; const s = el(), fast = dy > 40 && dy / Math.max(1, Date.now()-t0) > 0.6; y0 = null; s.style.transition = '';
    s.style.transform = ''; if (dy > s.offsetHeight * 0.25 || dy > 140 || fast) closeX(); };
  document.addEventListener('touchend', end, { passive:true }); document.addEventListener('touchcancel', end, { passive:true });
})();

/* ==========================================================================
   SETUP + START
   ========================================================================== */
function showSetup(msg){
  $('#app').hidden = true; $('#setup').hidden = false;
  $('#urlField').hidden = !!API;
  if (msg){ $('#setupErr').textContent = msg; $('#setupErr').hidden = false; }
}
$('#btnConnect').onclick = async ()=>{
  const err = m => { $('#setupErr').textContent = m; $('#setupErr').hidden = false; $('#btnConnect').textContent = 'Open'; $('#btnConnect').disabled = false; };
  if (!$('#urlField').hidden){ const u = $('#inUrl').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return err('That should be your Apps Script URL, ending in /exec.'); API = u; }
  pass = $('#inKey').value.trim(); if (!pass) return err('Enter your passcode.');
  $('#btnConnect').textContent = 'Checking…'; $('#btnConnect').disabled = true;
  try{ setData(await apiGet()); lsSet(LS.pass, pass); lsSet(LS.api, API); start(); }
  catch(e){ err(e.kind==='auth' ? 'That passcode did not work.' : 'Could not reach the sheet. Check your connection and try again.'); }
};
$('#inKey').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#btnConnect').click(); });
$('#buildStamp2').textContent = 'App ' + BUILD;

function start(){
  $('#setup').hidden = true; $('#app').hidden = false;
  applySkin(); if (D) paintSub();
  requestAnimationFrame(()=>moveBlob(false));
  if (!D || Date.now()-syncedAt() > 30000) refresh(false);
}
if (pass && API) start(); else showSetup();
</script>
<script>
/* One floating × for whichever free-text field has focus and some text: tap it to
   empty the field (an input event follows, so the app sees the change). Date, month,
   search (it has its own), checkbox and file fields are left alone. */
(function(){
  const btn = document.createElement('button'); btn.id = 'xclr'; btn.type = 'button'; btn.setAttribute('aria-label','Clear');
  btn.innerHTML = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
  document.body.appendChild(btn);
  let cur = null;
  const ok = el => el && el.tagName==='INPUT' && !el.closest('.xa-in') && !el.readOnly && !el.disabled && !/^(date|month|time|datetime-local|search|checkbox|radio|file|hidden|range|color|button|submit)$/i.test(el.type||'text');
  const place = ()=>{
    if (!cur || !document.body.contains(cur) || !cur.value){ btn.classList.remove('show'); return; }
    const r = cur.getBoundingClientRect(); if (!r.width){ btn.classList.remove('show'); return; }
    btn.style.left = (r.right - 26) + 'px'; btn.style.top = (r.top + r.height/2 - 11) + 'px'; btn.classList.add('show');
  };
  document.addEventListener('focusin', e=>{ if (cur && cur!==e.target) cur.classList.remove('has-clr'); cur = ok(e.target) ? e.target : null; if (cur) cur.classList.add('has-clr'); place(); });
  document.addEventListener('focusout', e=>{ setTimeout(()=>{ if (document.activeElement!==cur){ if (cur) cur.classList.remove('has-clr'); cur = null; place(); } }, 0); });
  document.addEventListener('input', e=>{ if (e.target===cur) place(); });
  window.addEventListener('scroll', place, true); window.addEventListener('resize', place);
  // keep focus on the field while tapping ×
  btn.addEventListener('pointerdown', e=>e.preventDefault());
  btn.addEventListener('mousedown', e=>e.preventDefault());
  btn.addEventListener('click', ()=>{ if (!cur) return; cur.value = ''; cur.dispatchEvent(new Event('input', {bubbles:true})); cur.dispatchEvent(new Event('change', {bubbles:true})); cur.focus(); place(); });
})();
</script>
